# Tools scenario (tools/fold_tools.py): the lifecycle profile with tool turns
# folding, room for replies that carry tool_facts, and summary room for the
# values the gateway keeps from each result. The other scenarios keep their
# own files, with a 512-token summarizer budget and 1200 summary chars.
tenants:
  - tenant_id: plain
    enabled: true
    credentials:
      - key_id: ak_bench_plain
        key_env: GATEWAY_KEY_PLAIN
        scopes: [chat:stream, models:read]
    allowed_models: ["groq/gpt-oss-120b"]
    default_model: groq/gpt-oss-120b
  - tenant_id: folded
    enabled: true
    credentials:
      - key_id: ak_bench_folded
        key_env: GATEWAY_KEY_FOLDED
        scopes: [chat:stream, models:read]
    allowed_models: ["groq/gpt-oss-120b", "groq/gpt-oss-20b"]
    default_model: groq/gpt-oss-120b
    # Receipts on, so the gateway returns the summary it sent
    # (x-gateway-fold-summary) and the benchmark can keep it.
    receipts: true
    folding:
      enabled: true
      summarizer_model: groq/gpt-oss-20b
      keep_last: 4
      summary_chars: 2400
      summarizer_max_tokens: 1024
      max_folds: 5
      refold_threshold: 8
      min_new_turns: 1
      min_new_tokens: 0
      amortization_requests: 4
      min_saving_nano_usd: 0
      fold_tool_turns: true
  - tenant_id: benchmark-admin
    enabled: true
    credentials:
      - key_id: ak_bench_admin
        key_env: GATEWAY_KEY_BENCH_ADMIN
        scopes: [admin]
    allowed_models: ["groq/gpt-oss-120b"]
